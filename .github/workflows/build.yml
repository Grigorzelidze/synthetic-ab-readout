name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: readout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d readout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: readout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r requirements.txt
      - run: make build
      - run: make test
      - run: make check
